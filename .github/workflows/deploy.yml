name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version from git tag
        run: echo "APP_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo '1.2.0')" >> $GITHUB_ENV

      - name: Build Nuxt
        run: npm run build
        env:
          NUXT_TELEMETRY_DISABLED: 1
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.jsonc 里 main: worker/src/index.ts 会自动打包 Worker 代码
          # --assets 会把 .output/public 作为静态文件一起部署
          # 两者结合：Worker 代码 + Nuxt 静态资源一起打包进同一个 Worker
          command: deploy --name cloudflare-discussion --assets .output/public
