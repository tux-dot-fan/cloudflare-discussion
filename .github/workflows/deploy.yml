name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version from git tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null | tr -d 'v')
          echo "APP_VERSION=${TAG:-1.2.0}" >> $GITHUB_ENV

      - name: Build Nuxt
        run: npm run build
        env:
          NUXT_TELEMETRY_DISABLED: 1
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name cloudflare-discussion --assets .output/public --define "APP_VERSION:\"${{ env.APP_VERSION }}\""
